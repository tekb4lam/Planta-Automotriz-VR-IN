<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planta Automotriz VR IN · Simulador de riesgos OT</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1620; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #e8f1f8; }
  #app canvas { display: block; touch-action: none; }
  #top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .brand { background: rgba(11,22,32,.82); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; border: 1px solid #28445a; }
  .brand small { display: block; color: #38e1ff; font-size: 11px; letter-spacing: .08em; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: #38e1ff; color: #06202a; }
  button.secondary { background: rgba(11,22,32,.82); color: #e8f1f8; border: 1px solid #28445a; }
  button:disabled { background: #33485a; color: #9fb3c3; cursor: default; }
  #note { font-size: 13px; color: #c9d8e3; background: rgba(11,22,32,.7); padding: 6px 10px; border-radius: 8px; max-width: 520px; }
  #panel { position: fixed; left: 12px; bottom: 12px; }
  #tablet { width: min(560px, 46vw); aspect-ratio: 1024 / 680; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); border: 1px solid #28445a; cursor: pointer; display: block; }
  #help { margin-top: 6px; font-size: 12px; color: #c9d8e3; background: rgba(11,22,32,.75); padding: 6px 10px; border-radius: 8px; width: fit-content; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1620; font-size: 20px; z-index: 9; }
  kbd { background: #1a2e3e; border: 1px solid #33485a; border-radius: 4px; padding: 0 4px; font-family: inherit; }
</style>
</head>
<body>
<div id="loading">Construyendo la planta…</div>
<div id="app"></div>
<div id="top">
  <div class="brand"><small>INET · CYBERSECURITY EXPERTS</small>Planta Automotriz VR IN · Riesgos OT</div>
  <button id="vr">Comprobando VR…</button>
  <button class="secondary" onclick="document.getElementById('panel').style.display = document.getElementById('panel').style.display === 'none' ? '' : 'none'">Panel</button>
  <div id="note"></div>
</div>
<div id="panel">
  <canvas id="tablet" width="1024" height="680"></canvas>
  <div id="help"><kbd>W A S D</kbd> caminar · <kbd>Shift</kbd> correr · arrastrar: mirar · <kbd>1</kbd>–<kbd>6</kbd> ataques · <kbd>F</kbd> defensas · <kbd>N</kbd> red OT · <kbd>V</kbd> siguiente zona · <kbd>R</kbd> restablecer</div>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
